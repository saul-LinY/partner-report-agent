services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: partner_report
      POSTGRES_USER: partner_report
      POSTGRES_PASSWORD: partner_report
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partner_report -d partner_report"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - partner-report-postgres:/var/lib/postgresql/data

volumes:
  partner-report-postgres:
