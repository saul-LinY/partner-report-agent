name: partner-report-lan

x-platform-service: &platform-service
  image: partner-report-platform:lan
  build:
    context: .
    target: platform
  env_file:
    - ${PARTNER_REPORT_ENV_FILE:-.env.server}
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: partner_report
      POSTGRES_USER: partner_report
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partner_report -d partner_report"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    <<: *platform-service
    command: npm run start -w @partner-report/api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4310/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "4310:4310"

  worker:
    <<: *platform-service
    command: npm run start -w @partner-report/worker

  web:
    image: partner-report-web:lan
    build:
      context: .
      target: web
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
        VITE_GOOGLE_LOGIN_ENABLED: ${VITE_GOOGLE_LOGIN_ENABLED:-false}
        VITE_LOCAL_LOGIN_ENABLED: ${VITE_LOCAL_LOGIN_ENABLED:-true}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4311/"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "4311:4311"
    restart: unless-stopped

volumes:
  postgres-data:
