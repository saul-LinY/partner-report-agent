name: WeeklyReport
options:
  bundleIdPrefix: com.weeklyreport
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "27.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  WeeklyReportCore:
    type: framework
    platform: macOS
    sources: [Sources/Core]
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weeklyreport.core
        GENERATE_INFOPLIST_FILE: YES
  WeeklyReport:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Resources/Assets.xcassets
      - path: Resources/Reader/cc-session-reader
        type: file
        buildPhase: resources
    dependencies:
      - target: WeeklyReportCore
      - target: WeeklyReportBackground
        link: false
        embed: false
      - package: Sparkle
    postBuildScripts:
      - name: Embed Background Service
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          ditto "$BUILT_PRODUCTS_DIR/weekly-report-background" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/weekly-report-background"
          cp "$SRCROOT/Resources/LaunchAgents/com.weeklyreport.desktop.background.plist" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents/com.weeklyreport.desktop.background.plist"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/weekly-report-background
          - $(SRCROOT)/Resources/LaunchAgents/com.weeklyreport.desktop.background.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/weekly-report-background
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/com.weeklyreport.desktop.background.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weeklyreport.desktop.preview
        PRODUCT_NAME: weekly report
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2.3"
        CURRENT_PROJECT_VERSION: "7"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        WEEKLY_REPORT_SERVICE_URL: "http://127.0.0.1:4314"
        WEEKLY_REPORT_UPDATE_FEED_URL: "https://raw.githubusercontent.com/saul-LinY/partner-report-agent/main/apps/macos/appcast.xml"
        WEEKLY_REPORT_UPDATE_PUBLIC_KEY: "LYRidDuWaeUajQ8hio/aApJHayOic/9b7S6Inb17Z6s="
  WeeklyReportBackground:
    type: tool
    platform: macOS
    sources: [Sources/Background]
    dependencies:
      - target: WeeklyReportCore
    settings:
      base:
        PRODUCT_NAME: weekly-report-background
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  WeeklyReportCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: WeeklyReportCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weeklyreport.coretests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WeeklyReport:
    build:
      targets:
        WeeklyReport: all
    test:
      targets: [WeeklyReportCoreTests]
    run:
      config: Debug
