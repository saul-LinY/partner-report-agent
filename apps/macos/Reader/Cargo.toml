[package]
name = "cc-session-reader"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
regex = "1"
zstd = "0.13"
url = "2"
base64 = "0.22"
log = "0.4"
dirs = "5"
sha2 = "0.10"

json5 = "0.4"
