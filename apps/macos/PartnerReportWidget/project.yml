name: PartnerReportDesktop
options:
  bundleIdPrefix: com.partnerreport
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9RN69TVL38
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "9"
targets:
  PartnerReport:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
      - path: WidgetExtension/ReviewIntents.swift
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - 9RN69TVL38.partnerreport.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.partnerreport.desktop
        PRODUCT_NAME: Partner Report
        INFOPLIST_FILE: Config/App-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PartnerReportWidget
        embed: true
  PartnerReportWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: WidgetExtension
        excludes:
          - Info.plist
      - path: Shared
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - 9RN69TVL38.partnerreport.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.partnerreport.desktop.widget
        PRODUCT_NAME: Partner Report Widget
        INFOPLIST_FILE: WidgetExtension/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
